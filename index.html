<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Nibbles</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f3d2e'/%3E%3Cpath d='M22 23c2-3 6-5 10-5 7 0 12 5 12 11s-5 11-12 11c-4 0-8-2-10-5l5-4c1 2 3 3 5 3 4 0 7-3 7-6s-3-6-7-6c-2 0-4 1-5 3l-5-4z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-brand">
        <div class="app-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" role="img" focusable="false">
            <path
              d="M12 3c-4.4 0-8 3.1-8 7 0 2.5 1.5 4.8 3.8 6.1V20l3-1.8c.4 0 .8.1 1.2.1 4.4 0 8-3.1 8-7s-3.6-7-8-7zm-2.4 6.2c.5-.5 1.2-.8 2-.8 1.6 0 2.8 1.1 2.8 2.6 0 1.4-1.2 2.6-2.8 2.6-.8 0-1.5-.3-2-.8l.9-.9c.3.3.7.5 1.1.5.9 0 1.6-.6 1.6-1.4 0-.8-.7-1.4-1.6-1.4-.4 0-.8.2-1.1.5l-.9-.9z"
            />
          </svg>
        </div>
        <div class="app-title">Number Nibbles</div>
      </div>
    </header>
    <main class="wrap">
      <header class="hud">
        <div class="title"></div>
        <div class="menu">
          <button id="levelsMenuBtn" aria-expanded="false" aria-controls="levelsPanel">Levels</button>
        </div>
        <div class="stats">
          <div class="score">Score: <span id="score">0</span></div>
          <div class="timer">Time: <span id="timer">0:00</span></div>
        </div>
        <div class="meta">
          <div class="status" id="status">Ready</div>
        </div>
        <div class="actions">
          <button id="start">Start</button>
          <button id="pause" disabled>Pause</button>
        </div>
        <div class="a11y">
          <button id="contrastToggle" aria-pressed="false">High Contrast</button>
          <button id="textToggle" aria-pressed="false">Large Text</button>
        </div>
      </header>

      <div class="layout">
        <section class="levels" id="levelsPanel" aria-label="Levels">
          <div class="label">Levels</div>
          <div class="level-grid" id="levels"></div>
        </section>
        <div class="levels-backdrop" id="levelsBackdrop" hidden></div>

        <div class="game-stack">
          <section class="question-banner" aria-live="polite">
            <div class="label"></div>
            <div class="question-text" id="question">---</div>
          </section>

          <section class="board">
            <canvas id="game" width="400" height="400" aria-label="Snake game"></canvas>
            <div class="overlay hidden" id="overlay">
              <div class="card">
                <div class="card-title" id="overlayTitle">Game Over</div>
                <div class="card-score">
                  <div>Score: <span id="overlayScore">0</span></div>
                  <div>Correct: <span id="overlayCorrect">0</span> / 10</div>
                  <div>Time: <span id="overlayTime">0:00</span></div>
                  <div id="overlayUnlock">Next level locked</div>
                </div>
                <div class="card-actions">
                  <button id="overlayRetry">Restart Level</button>
                  <button id="overlayNext">Next Level</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>

      <section class="controls" aria-label="On-screen controls">
        <div class="row">
          <button data-dir="up">Up</button>
        </div>
        <div class="row">
          <button data-dir="left">Left</button>
          <button data-dir="down">Down</button>
          <button data-dir="right">Right</button>
        </div>
      </section>

      <p class="hint">Controls: Arrow keys or WASD. Space to pause.</p>
    </main>

    <script type="module" src="./src/game.js"></script>
  </body>
</html>
